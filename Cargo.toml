[package]
name = "hnm"
version = "0.2.1"
edition = "2024"
description = "Install the agent documentation harness (PRD/ADR/spec, feature-dev, commit gate) into a project"
license = "MIT"
readme = "README.md"
keywords = ["cli", "agents", "harness", "docs"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
minijinja = "2"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
